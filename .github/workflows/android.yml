name: Android APK

# Builds the APK on demand, and on a release so the tag gets a downloadable
# asset. `workflow_dispatch` is what you use to test the build without cutting
# a release; `release: published` is what attaches the APK to it.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version for the APK filename, e.g. 1.0.0 (defaults to the run number)"
        required: false
        type: string
  release:
    types: [published]

# The release job needs to upload an asset to the release it was triggered by.
permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Node 22 LTS, because the Capacitor CLI declares engines >=22.0.0 and
      # refuses to run on anything older. This step is first, so every later
      # step — npm ci, the web build, cap sync and Gradle — uses it.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # `packages: ''` is deliberate. The action's default package list still
      # includes `tools`, the legacy SDK Tools package Google removed from the
      # repository — sdkmanager cannot resolve it and exits 1, which is the
      # "Failed to find package 'tools'" failure. Passing an empty list skips
      # that default install; the next step then installs exactly what this
      # project builds against.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      # Exactly what this project builds against:
      #   platforms;android-36  - compileSdk/targetSdk 36 (android/variables.gradle)
      #   build-tools;35.0.0    - AGP 8.13's default and minimum revision
      #   platform-tools        - adb and the packaging tools
      # Gradle 8.14.3 and JDK 21 are both above AGP 8.13's minimums (8.13, 17).
      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;35.0.0"
          sdkmanager --list_installed

      # `npm ci` installs exactly what package-lock.json pins, which is what a
      # release build should be built from.
      - name: Install dependencies
        run: npm ci

      # The toolchain this build actually got. `cap --version` is the one that
      # matters: the Capacitor CLI requires Node >=22, and reporting it here
      # means a version mismatch is visible before `cap sync` fails on it.
      - name: Report tool versions
        run: |
          echo "node    $(node --version)"
          echo "npm     $(npm --version)"
          echo "cap     $(npx cap --version)"
          echo "java    $(java -version 2>&1 | head -1)"

      # The version the APK reports and is named after. A release uses its tag
      # (v1.0.0 -> 1.0.0); a manual run uses the input, or falls back to the
      # run number so every artifact is still distinguishable.
      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            VERSION="${{ github.event.release.tag_name }}"
            VERSION="${VERSION#v}"
          elif [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="0.0.0-build.${{ github.run_number }}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building Ugnay AI $VERSION"

      # An unset secret expands to an empty string rather than failing, so a
      # missing one would otherwise surface as a build error several steps
      # later. This says plainly which secret is absent, without printing any
      # value: only whether each one is set.
      # A repository *variable* is accepted as a fallback. Both values are
      # public by design — the deployed site already serves them to every
      # browser, and Row Level Security is what protects the data — so a
      # variable is a legitimate place to put them, and it is visible in the
      # UI, which a secret is not.
      - name: Check the build secrets are set
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || vars.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY || vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          missing=0
          for name in SUPABASE_URL SUPABASE_KEY; do
            if [ -z "${!name}" ]; then
              case "$name" in
                SUPABASE_URL) echo "::error::Repository secret NEXT_PUBLIC_SUPABASE_URL is not set." ;;
                SUPABASE_KEY) echo "::error::Repository secret NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY is not set." ;;
              esac
              missing=1
            fi
          done
          if [ "$missing" = "1" ]; then
            echo ""
            echo "Add them at:"
            echo "  https://github.com/${{ github.repository }}/settings/secrets/actions"
            echo ""
            echo "They must be Repository secrets on the Actions tab - not Dependabot,"
            echo "not Codespaces, and not an Environment secret, none of which this"
            echo "workflow can read. Paste the value only, without the NAME= prefix."
            echo ""
            echo "This run: repository=${{ github.repository }} ref=${{ github.ref }}"
            echo "Secrets are per repository, so a fork has its own set."
            exit 1
          fi
          echo "Both Supabase build secrets are set."

      # The deployed site the app calls for chat, knowledge and everything else
      # server-side. It is a public URL, not a secret, but it lives in a
      # repository variable so a fork can point at its own deployment.
      - name: Build web bundle
        env:
          NEXT_PUBLIC_API_ORIGIN: ${{ vars.NEXT_PUBLIC_API_ORIGIN || 'https://ugnayai.vercel.app' }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY || vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build:android:web

      - name: Sync Capacitor
        run: npx cap sync android

      # Written from a secret and deleted after the build. Without the secret
      # the APK is built unsigned, which is still useful for a dispatch run but
      # cannot be installed — the release job checks for this below.
      # `secrets` cannot be used in a step-level `if:`, so the presence check
      # happens inside the step instead. No secret is ever echoed: the value
      # goes straight to base64 through an environment variable.
      - name: Decode signing keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No ANDROID_KEYSTORE_BASE64 secret set - the APK will be unsigned."
            exit 0
          fi

          # All four are needed together. Decoding the keystore while a
          # password is missing produces a confusing Gradle failure much later,
          # so say which one is absent now. Only presence is reported.
          missing=""
          [ -z "$KEYSTORE_PASSWORD" ] && missing="$missing ANDROID_KEYSTORE_PASSWORD"
          [ -z "$KEY_ALIAS" ]         && missing="$missing ANDROID_KEY_ALIAS"
          [ -z "$KEY_PASSWORD" ]      && missing="$missing ANDROID_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is set but these are not:$missing"
            exit 1
          fi

          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"

          # A truncated or mis-pasted secret decodes to something that is not a
          # keystore. keytool -list reads it with the password, which checks
          # the file and the password together before Gradle depends on them.
          if ! keytool -list -keystore "$RUNNER_TEMP/release.keystore" \
              -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null 2>&1; then
            echo "::error::The keystore could not be read with the given password and alias."
            echo "Check ANDROID_KEYSTORE_BASE64 is the whole base64 string (base64 -w0),"
            echo "and that ANDROID_KEYSTORE_PASSWORD and ANDROID_KEY_ALIAS match the key."
            rm -f "$RUNNER_TEMP/release.keystore"
            exit 1
          fi

          echo "path=$RUNNER_TEMP/release.keystore" >> "$GITHUB_OUTPUT"
          echo "Signing keystore ready."

      # git preserves the executable bit, but a wrapper regenerated by
      # `npx cap add android` on Windows arrives without it.
      - name: Make the Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Build release APK
        env:
          APP_VERSION_NAME: ${{ steps.version.outputs.version }}
          APP_VERSION_CODE: ${{ github.run_number }}
          ANDROID_KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon
        working-directory: android

      # Gradle's output name is fixed; the asset is named for the release.
      #
      # Whether the APK is signed is decided by apksigner, not by the filename.
      # Gradle names its output app-release.apk once a signingConfig is
      # attached, but that name alone does not prove the signature is present
      # and valid — and this is what decides whether the file is published.
      - name: Name and verify the APK
        id: apk
        run: |
          RELEASE=android/app/build/outputs/apk/release/app-release.apk
          UNSIGNED=android/app/build/outputs/apk/release/app-release-unsigned.apk

          if [ -f "$RELEASE" ]; then
            FOUND="$RELEASE"
          elif [ -f "$UNSIGNED" ]; then
            FOUND="$UNSIGNED"
          else
            echo "::error::No APK was produced. Check the Gradle output above."
            ls -R android/app/build/outputs 2>/dev/null || true
            exit 1
          fi

          NAME="Ugnay-AI-v${{ steps.version.outputs.version }}.apk"
          cp "$FOUND" "$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          if [ -z "$APKSIGNER" ]; then
            echo "::error::apksigner not found in the Android SDK."
            exit 1
          fi

          # `verify` exits non-zero when the APK carries no valid signature.
          # It prints the certificate, never the key or any password.
          if "$APKSIGNER" verify --print-certs "$NAME"; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "The APK is signed."
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "The APK is NOT signed."
          fi

          ls -la "$NAME"

      # The keystore is removed as soon as the build no longer needs it, and
      # `always()` so an earlier failure does not leave it on the runner.
      # A hosted runner is discarded after the job, but a self-hosted one is
      # not, and the file is the signing key itself.
      - name: Remove the signing keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"

      # An unsigned APK cannot be installed, so it is neither published nor
      # offered as an artifact someone might mistake for a working download.
      # On a release this is fatal; on a manual run it stops before the upload
      # and says what is missing.
      - name: Require a signed APK
        if: ${{ steps.apk.outputs.signed != 'true' }}
        run: |
          echo "::error::The APK is unsigned and cannot be installed."
          echo ""
          echo "Add these repository secrets, then run this workflow again:"
          echo "  ANDROID_KEYSTORE_BASE64     the keystore, base64-encoded"
          echo "  ANDROID_KEYSTORE_PASSWORD   keystore password"
          echo "  ANDROID_KEY_ALIAS           key alias"
          echo "  ANDROID_KEY_PASSWORD        key password"
          echo ""
          echo "  https://github.com/${{ github.repository }}/settings/secrets/actions"
          echo ""
          echo "See README -> Android app -> Releasing for how to generate the key."
          exit 1

      # Reached only for a signed APK, so nothing uninstallable is ever
      # published or downloadable from a run.
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.name }}
          if-no-files-found: error
          retention-days: 30

      - name: Attach the APK to the release
        if: ${{ github.event_name == 'release' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "${{ steps.apk.outputs.name }}" --clobber
