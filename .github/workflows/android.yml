name: Android APK

# Builds the APK on demand, and on a release so the tag gets a downloadable
# asset. `workflow_dispatch` is what you use to test the build without cutting
# a release; `release: published` is what attaches the APK to it.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version for the APK filename, e.g. 1.0.0 (defaults to the run number)"
        required: false
        type: string
  release:
    types: [published]

# The release job needs to upload an asset to the release it was triggered by.
permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # `packages: ''` is deliberate. The action's default package list still
      # includes `tools`, the legacy SDK Tools package Google removed from the
      # repository — sdkmanager cannot resolve it and exits 1, which is the
      # "Failed to find package 'tools'" failure. Passing an empty list skips
      # that default install; the next step then installs exactly what this
      # project builds against.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      # Exactly what this project builds against:
      #   platforms;android-36  - compileSdk/targetSdk 36 (android/variables.gradle)
      #   build-tools;35.0.0    - AGP 8.13's default and minimum revision
      #   platform-tools        - adb and the packaging tools
      # Gradle 8.14.3 and JDK 21 are both above AGP 8.13's minimums (8.13, 17).
      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;35.0.0"
          sdkmanager --list_installed

      # `npm ci` installs exactly what package-lock.json pins, which is what a
      # release build should be built from.
      - name: Install dependencies
        run: npm ci

      # The version the APK reports and is named after. A release uses its tag
      # (v1.0.0 -> 1.0.0); a manual run uses the input, or falls back to the
      # run number so every artifact is still distinguishable.
      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            VERSION="${{ github.event.release.tag_name }}"
            VERSION="${VERSION#v}"
          elif [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="0.0.0-build.${{ github.run_number }}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building Ugnay AI $VERSION"

      # An unset secret expands to an empty string rather than failing, so a
      # missing one would otherwise surface as a build error several steps
      # later. This says plainly which secret is absent, without printing any
      # value: only whether each one is set.
      - name: Check the build secrets are set
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          missing=0
          for name in SUPABASE_URL SUPABASE_KEY; do
            if [ -z "${!name}" ]; then
              case "$name" in
                SUPABASE_URL) echo "::error::Repository secret NEXT_PUBLIC_SUPABASE_URL is not set." ;;
                SUPABASE_KEY) echo "::error::Repository secret NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY is not set." ;;
              esac
              missing=1
            fi
          done
          if [ "$missing" = "1" ]; then
            echo "Add them under Settings -> Secrets and variables -> Actions."
            echo "Both values are in your local .env (Supabase -> Project Settings -> API)."
            exit 1
          fi
          echo "Both Supabase build secrets are set."

      # The deployed site the app calls for chat, knowledge and everything else
      # server-side. It is a public URL, not a secret, but it lives in a
      # repository variable so a fork can point at its own deployment.
      - name: Build web bundle
        env:
          NEXT_PUBLIC_API_ORIGIN: ${{ vars.NEXT_PUBLIC_API_ORIGIN || 'https://ugnayai.vercel.app' }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build:android:web

      - name: Sync Capacitor
        run: npx cap sync android

      # Written from a secret and deleted after the build. Without the secret
      # the APK is built unsigned, which is still useful for a dispatch run but
      # cannot be installed — the release job checks for this below.
      # `secrets` cannot be used in a step-level `if:`, so the presence check
      # happens inside the step instead. No secret is ever echoed: the value
      # goes straight to base64 through an environment variable.
      - name: Decode signing keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No ANDROID_KEYSTORE_BASE64 secret set - the APK will be unsigned."
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "path=$RUNNER_TEMP/release.keystore" >> "$GITHUB_OUTPUT"
          echo "Signing keystore ready."

      # git preserves the executable bit, but a wrapper regenerated by
      # `npx cap add android` on Windows arrives without it.
      - name: Make the Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Build release APK
        env:
          APP_VERSION_NAME: ${{ steps.version.outputs.version }}
          APP_VERSION_CODE: ${{ github.run_number }}
          ANDROID_KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon
        working-directory: android

      # Gradle's output name is fixed; the asset is named for the release.
      - name: Name the APK
        id: apk
        run: |
          SRC=android/app/build/outputs/apk/release/app-release.apk
          UNSIGNED=android/app/build/outputs/apk/release/app-release-unsigned.apk
          if [ -f "$SRC" ]; then
            FOUND="$SRC"; SIGNED=true
          elif [ -f "$UNSIGNED" ]; then
            FOUND="$UNSIGNED"; SIGNED=false
          else
            echo "::error::No APK was produced. Check the Gradle output above."
            ls -R android/app/build/outputs 2>/dev/null || true
            exit 1
          fi
          NAME="Ugnay-AI-v${{ steps.version.outputs.version }}.apk"
          cp "$FOUND" "$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "signed=$SIGNED" >> "$GITHUB_OUTPUT"
          ls -la "$NAME"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.name }}
          if-no-files-found: error
          retention-days: 30

      # An unsigned APK cannot be installed, so publishing one as a release
      # asset would give people a download that fails on their phone. Fail
      # loudly instead, with what to do about it.
      - name: Require a signed APK for a release
        if: ${{ github.event_name == 'release' && steps.apk.outputs.signed != 'true' }}
        run: |
          echo "::error::The APK is unsigned and cannot be installed."
          echo "Add the ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,"
          echo "ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD repository secrets,"
          echo "then re-run this workflow. See README -> Android app."
          exit 1

      - name: Attach the APK to the release
        if: ${{ github.event_name == 'release' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "${{ steps.apk.outputs.name }}" --clobber
